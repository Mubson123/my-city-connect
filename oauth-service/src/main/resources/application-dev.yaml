spring:
  application:
    name: oauth-service

  # TO USE ONLY FOR TESTING

  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  sql:
    init:
      mode: always

  flyway:
    enabled: false
  liquibase:
    enabled: false

jwt:
  secret: flpZVEZrUG1ORD01Y2MxInkyP2oiQFFqeTN0TXk4NTk=
  expiration-time: 36000000
  refresh-expiration-time: 86400000

logging:
  level:
    root: warn
    org.springframework: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    com.mc.citizen: debug
